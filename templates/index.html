<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1d1e1a" media="(prefers-color-scheme: dark)">
    <title>{{.ID}} · 记事本</title>
    <link rel="icon" href="{{.AssetBase}}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{.AssetBase}}style.css">
</head>
<body>
    <header class="toolbar">
        <div class="identity">
            <span class="mark" aria-hidden="true"></span>
            <span class="label">记事本</span>
            <span class="note-id" title="当前文档 ID">{{.ID}}</span>
        </div>
        <div class="toolbar-actions">
            <span id="save-status" class="status" data-state="saved" role="status" aria-live="polite" title="文档会自动保存">已保存</span>
            <a class="tool-button" href="{{.DownloadURL}}" download="{{.ID}}.txt" title="下载为 {{.ID}}.txt">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M5 19.5h14"/>
                </svg>
                <span class="button-text">下载</span>
            </a>
            <a class="tool-button" href="{{.NewNoteURL}}" title="新建文档">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span class="button-text">新建</span>
            </a>
        </div>
    </header>

    <main class="editor">
        <textarea id="content" data-note-id="{{.ID}}" spellcheck="false" autocomplete="off" autocapitalize="off" autofocus aria-label="记事本内容" placeholder="开始输入…">
{{.Content}}</textarea>
    </main>

    <noscript>
        <p class="noscript">需要启用 JavaScript 才能自动保存。</p>
    </noscript>

    <script src="{{.AssetBase}}app.js" defer></script>
</body>
</html>
