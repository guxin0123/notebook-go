# 记事本 Nginx 反向代理示例。
# 复制到 /etc/nginx/sites-available/notebook 并按需修改 server_name / TLS 配置。
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # 应用默认限制 1 MiB，这里留一点余量；超限请求会由应用返回 413。
    client_max_body_size 2m;
    server_tokens off;

    # 公网部署时强烈建议启用访问认证：
    # auth_basic "Notebook";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 部署在二级目录时，删掉上面的 location /，改用下面两段，
    # 并让程序带上 -base-path /note（或 NOTEBOOK_BASE_PATH=/note）启动：
    # location = /note {
    #     return 301 /note/;
    # }
    # location /note/ {
    #     # 末尾的 / 会去掉 /note 前缀再转发；保留前缀的写法也能正常工作。
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout 30s;
    #     proxy_send_timeout 30s;
    # }
}
